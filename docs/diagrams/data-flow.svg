<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#0b1220"/>
  <text x="24" y="36" fill="#e2e8f0" font-size="20" font-weight="700">GridShield AI — Data Flow (raw vs trusted planes)</text>

  <rect x="40" y="70" width="200" height="80" rx="10" fill="#111c33" stroke="#f59e0b"/>
  <text x="140" y="100" fill="#fbbf24" font-size="13" text-anchor="middle" font-weight="700">Digital twin step</text>
  <text x="140" y="122" fill="#cbd5e1" font-size="11" text-anchor="middle">true state (physics)</text>

  <rect x="290" y="70" width="200" height="80" rx="10" fill="#111c33" stroke="#ef4444"/>
  <text x="390" y="96" fill="#f87171" font-size="13" text-anchor="middle" font-weight="700">Attack injection</text>
  <text x="390" y="118" fill="#cbd5e1" font-size="11" text-anchor="middle">corrupts metered_* only</text>

  <rect x="540" y="60" width="380" height="100" rx="10" fill="#1a1035" stroke="#a78bfa"/>
  <text x="730" y="84" fill="#c4b5fd" font-size="12" text-anchor="middle" font-weight="700">RAW WINDOW (what SCADA sees)</text>
  <text x="730" y="106" fill="#cbd5e1" font-size="11" text-anchor="middle">metered solar/load · per-building MB_* · battery</text>
  <text x="730" y="126" fill="#94a3b8" font-size="11" text-anchor="middle">feeds DETECTION only — never control</text>

  <rect x="540" y="200" width="380" height="100" rx="10" fill="#0f1a2e" stroke="#22c55e"/>
  <text x="730" y="224" fill="#4ade80" font-size="12" text-anchor="middle" font-weight="700">TRUSTED WINDOW (what the AI acts on)</text>
  <text x="730" y="246" fill="#cbd5e1" font-size="11" text-anchor="middle">isolated devices replaced by reconstructions</text>
  <text x="730" y="266" fill="#94a3b8" font-size="11" text-anchor="middle">feeds FORECAST · MPC · classifier context</text>

  <rect x="60" y="200" width="220" height="100" rx="10" fill="#0f172a" stroke="#38bdf8"/>
  <text x="170" y="224" fill="#7dd3fc" font-size="12" text-anchor="middle" font-weight="700">DETECTION + CLASSIFIER</text>
  <text x="170" y="246" fill="#cbd5e1" font-size="11" text-anchor="middle">fused score = weighted channels,</text>
  <text x="170" y="264" fill="#cbd5e1" font-size="11" text-anchor="middle">0.78 × max-channel veto · threshold</text>
  <text x="170" y="282" fill="#94a3b8" font-size="11" text-anchor="middle">calibrated at P99.5 of clean traffic</text>

  <rect x="60" y="340" width="220" height="90" rx="10" fill="#0f172a" stroke="#ef4444"/>
  <text x="170" y="364" fill="#f87171" font-size="12" text-anchor="middle" font-weight="700">RESPONDER</text>
  <text x="170" y="386" fill="#cbd5e1" font-size="11" text-anchor="middle">isolate device · revoke control</text>
  <text x="170" y="404" fill="#cbd5e1" font-size="11" text-anchor="middle">re-admit after 8 clean steps</text>

  <rect x="340" y="340" width="240" height="90" rx="10" fill="#0f172a" stroke="#f59e0b"/>
  <text x="460" y="364" fill="#fbbf24" font-size="12" text-anchor="middle" font-weight="700">RECONSTRUCTION</text>
  <text x="460" y="386" fill="#cbd5e1" font-size="11" text-anchor="middle">frozen-forecast / healthy-meter</text>
  <text x="460" y="404" fill="#cbd5e1" font-size="11" text-anchor="middle">consensus per corrupted channel</text>

  <rect x="640" y="340" width="240" height="90" rx="10" fill="#0f172a" stroke="#22c55e"/>
  <text x="760" y="364" fill="#4ade80" font-size="12" text-anchor="middle" font-weight="700">MPC RE-OPTIMIZATION</text>
  <text x="760" y="386" fill="#cbd5e1" font-size="11" text-anchor="middle">DP over SOC grid on trusted data</text>
  <text x="760" y="404" fill="#cbd5e1" font-size="11" text-anchor="middle">new defender setpoint each step</text>

  <!-- flows -->
  <line x1="240" y1="110" x2="288" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="490" y1="110" x2="538" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="730" y1="160" x2="730" y2="198" stroke="#22c55e" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="742" y="184" fill="#4ade80" font-size="10">reconstruction</text>
  <line x1="538" y1="110" x2="180" y2="198" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="300" y="150" fill="#64748b" font-size="10">scores</text>
  <line x1="170" y1="300" x2="170" y2="338" stroke="#ef4444" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="182" y="322" fill="#f87171" font-size="10">alert</text>
  <line x1="280" y1="385" x2="338" y2="385" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="580" y1="385" x2="638" y2="385" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="760" y1="338" x2="760" y2="302" stroke="#22c55e" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="772" y="324" fill="#4ade80" font-size="10">setpoint</text>
  <line x1="760" y1="302" x2="240" y2="96" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr2)"/>
  <text x="330" y="60" fill="#475569" font-size="10">defender setpoint → twin</text>

  <text x="24" y="500" fill="#64748b" font-size="11">Key invariant: control and forecasting run ONLY on the trusted plane; the raw plane exists to expose attacks.</text>
</svg>
