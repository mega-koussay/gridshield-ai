<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#0b1220"/>
  <text x="24" y="36" fill="#e2e8f0" font-size="20" font-weight="700">GridShield AI — System Architecture</text>

  <!-- Frontend layer -->
  <rect x="40" y="60" width="880" height="90" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="56" y="84" fill="#94a3b8" font-size="12" font-weight="700">DASHBOARD (React + TypeScript + Recharts, :5173)</text>
  <rect x="60" y="98" width="190" height="38" rx="8" fill="#111c33" stroke="#334155"/><text x="155" y="122" fill="#e2e8f0" font-size="12" text-anchor="middle">Digital-twin view (SVG)</text>
  <rect x="270" y="98" width="190" height="38" rx="8" fill="#111c33" stroke="#334155"/><text x="365" y="122" fill="#e2e8f0" font-size="12" text-anchor="middle">Live charts + forecasts</text>
  <rect x="480" y="98" width="200" height="38" rx="8" fill="#111c33" stroke="#334155"/><text x="580" y="122" fill="#e2e8f0" font-size="12" text-anchor="middle">AI explanation panel</text>
  <rect x="700" y="98" width="200" height="38" rx="8" fill="#111c33" stroke="#334155"/><text x="800" y="122" fill="#e2e8f0" font-size="12" text-anchor="middle">Attack / demo controls</text>

  <!-- API layer -->
  <rect x="40" y="185" width="880" height="70" rx="10" fill="#0f172a" stroke="#38bdf8"/>
  <text x="56" y="209" fill="#94a3b8" font-size="12" font-weight="700">API (FastAPI, :8000)</text>
  <text x="480" y="234" fill="#7dd3fc" font-size="13" text-anchor="middle">REST /api/* · WebSocket /ws/live (1 Hz full-state stream) · /health · SQLite event store</text>

  <!-- Orchestrator -->
  <rect x="40" y="290" width="880" height="70" rx="10" fill="#0f172a" stroke="#a78bfa"/>
  <text x="56" y="314" fill="#94a3b8" font-size="12" font-weight="700">ORCHESTRATOR — live control loop &amp; demo state machine</text>
  <text x="480" y="339" fill="#c4b5fd" font-size="13" text-anchor="middle">defender MPC → twin step → attacker hijack? → detect → classify → isolate → reconstruct → re-optimize → emit</text>

  <!-- Layers below -->
  <rect x="40" y="395" width="280" height="130" rx="10" fill="#0f172a" stroke="#f59e0b"/>
  <text x="56" y="419" fill="#fbbf24" font-size="12" font-weight="700">DIGITAL TWIN (deterministic)</text>
  <text x="56" y="443" fill="#cbd5e1" font-size="12">Solar PV · battery (SOC) · grid</text>
  <text x="56" y="463" fill="#cbd5e1" font-size="12">6 buildings · smart meters · SCADA</text>
  <text x="56" y="483" fill="#94a3b8" font-size="11">5-min steps, seeded RNG,</text>
  <text x="56" y="500" fill="#94a3b8" font-size="11">true state ≠ metered telemetry</text>

  <rect x="340" y="395" width="280" height="130" rx="10" fill="#0f172a" stroke="#22c55e"/>
  <text x="356" y="419" fill="#4ade80" font-size="12" font-weight="700">AI STACK (laptop-friendly)</text>
  <text x="356" y="443" fill="#cbd5e1" font-size="12">Ridge forecasters (solar, demand)</text>
  <text x="356" y="463" fill="#cbd5e1" font-size="12">Hybrid detector: z + iForest + control</text>
  <text x="356" y="483" fill="#cbd5e1" font-size="12">RF attack classifier · explanations</text>
  <text x="356" y="503" fill="#94a3b8" font-size="11">DP planner + MPC · FedAvg FL PoC</text>

  <rect x="640" y="395" width="280" height="130" rx="10" fill="#0f172a" stroke="#ef4444"/>
  <text x="656" y="419" fill="#f87171" font-size="12" font-weight="700">CYBER SIMULATION (local only)</text>
  <text x="656" y="443" fill="#cbd5e1" font-size="12">FDI_BULK · FDI_SOLAR · SCADA_CMD</text>
  <text x="656" y="463" fill="#cbd5e1" font-size="12">DEVICE_MALWARE · TELEMETRY_SPIKE</text>
  <text x="656" y="483" fill="#94a3b8" font-size="11">corrupts metered telemetry / control</text>
  <text x="656" y="500" fill="#94a3b8" font-size="11">never the true twin state</text>

  <!-- arrows -->
  <line x1="480" y1="150" x2="480" y2="183" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="492" y="172" fill="#64748b" font-size="11">WS push / REST</text>
  <line x1="480" y1="255" x2="480" y2="288" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="300" y1="360" x2="220" y2="393" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="480" y1="360" x2="480" y2="393" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="660" y1="360" x2="740" y2="393" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
</svg>
